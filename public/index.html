<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaScraper — comix.to</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* subtle glass container */
        .app {
            max-width: 1100px;
            width: 100%;
            background: rgba(18, 24, 34, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }

        h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.25rem;
        }
        h1 i {
            color: #5b7cfa;
            font-size: 1.6rem;
        }
        .sub {
            color: #8896b0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border-left: 3px solid #2a3a5a;
            padding-left: 1rem;
        }

        /* ----- search bar ----- */
        .search-section {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2.2rem;
        }
        .search-section input {
            flex: 1;
            min-width: 200px;
            padding: 0.85rem 1.2rem;
            border-radius: 60px;
            border: 1px solid #28303f;
            background: #131b26;
            color: #e8edf5;
            font-size: 1rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .search-section input:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 3px rgba(91, 124, 250, 0.25);
        }
        .search-section input::placeholder {
            color: #5a6a82;
        }

        .btn {
            padding: 0.85rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: background 0.2s, transform 0.1s, box-shadow 0.25s, border-color 0.2s;
            background: #2a3a5a;
            color: #d6e0f0;
            border: 1px solid transparent;
        }
        .btn-primary {
            background: #5b7cfa;
            color: #fff;
            border-color: #5b7cfa;
        }
        .btn-primary:hover {
            background: #4a6ae6;
            border-color: #4a6ae6;
            box-shadow: 0 8px 24px rgba(91, 124, 250, 0.35);
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #1f293d;
            color: #bcc9e0;
            border-color: #2d3a52;
        }
        .btn-secondary:hover {
            background: #2a3a5a;
            border-color: #3f5270;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .btn-success {
            background: #2b8f6c;
            color: #fff;
            border-color: #2b8f6c;
        }
        .btn-success:hover {
            background: #237a5b;
            border-color: #237a5b;
            box-shadow: 0 8px 24px rgba(43, 143, 108, 0.35);
            transform: scale(1.02);
        }

        .btn-danger {
            background: #b13e4b;
            color: #fff;
            border-color: #b13e4b;
        }
        .btn-danger:hover {
            background: #9a3440;
            border-color: #9a3440;
            box-shadow: 0 8px 24px rgba(177, 62, 75, 0.35);
            transform: scale(1.02);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ----- manga info (poster + title) ----- */
        .manga-header {
            display: flex;
            gap: 1.8rem;
            align-items: flex-start;
            margin-bottom: 2.5rem;
            background: rgba(10, 14, 22, 0.5);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            flex-wrap: wrap;
        }
        .manga-poster {
            flex-shrink: 0;
            width: 140px;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            background: #141c28;
            border: 1px solid #28303f;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }
        .manga-poster:hover {
            transform: scale(1.02);
        }
        .manga-poster-placeholder {
            width: 140px;
            height: 200px;
            border-radius: 12px;
            background: linear-gradient(145deg, #1a2330, #0e141c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3a4a62;
            font-size: 3rem;
            border: 1px solid #28303f;
        }
        .manga-details {
            flex: 1;
            min-width: 180px;
        }
        .manga-details h2 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
            line-height: 1.2;
        }
        .manga-details .meta {
            color: #8896b0;
            font-size: 0.9rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.2rem;
            margin-top: 0.4rem;
        }
        .manga-details .meta span {
            background: #141c28;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid #1f293d;
            font-size: 0.8rem;
        }
        .manga-details .desc {
            margin-top: 0.8rem;
            color: #b0bed6;
            font-size: 0.95rem;
            line-height: 1.5;
            max-height: 4.2em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        /* ----- chapter list ----- */
        .chapter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #1a2330;
        }
        .chapter-controls .left {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        .chapter-controls .right {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        .chapter-count {
            font-size: 0.9rem;
            color: #8896b0;
        }
        .chapter-count strong {
            color: #d6e0f0;
        }

        /* table-like chapter list */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .chapter-list::-webkit-scrollbar {
            width: 5px;
        }
        .chapter-list::-webkit-scrollbar-track {
            background: #0e141c;
            border-radius: 10px;
        }
        .chapter-list::-webkit-scrollbar-thumb {
            background: #2a3a5a;
            border-radius: 10px;
        }

        .chapter-row {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 1rem 0.6rem 0.8rem;
            background: rgba(20, 28, 40, 0.5);
            border-radius: 12px;
            border: 1px solid transparent;
            transition: background 0.2s, border 0.2s, transform 0.1s;
        }
        .chapter-row:hover {
            background: rgba(30, 42, 60, 0.6);
            border-color: #2a3a5a;
        }

        .chapter-row .ch-check {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            accent-color: #5b7cfa;
            cursor: pointer;
            transform: scale(1.1);
        }
        .chapter-row .ch-num {
            font-weight: 600;
            min-width: 70px;
            color: #d6e0f0;
            font-size: 0.95rem;
        }
        .chapter-row .ch-title {
            flex: 1;
            color: #b0bed6;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chapter-row .ch-pages {
            flex-shrink: 0;
            color: #5a6a82;
            font-size: 0.8rem;
            margin-right: 0.2rem;
            background: #0e141c;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            border: 1px solid #1a2330;
        }
        .chapter-row .ch-size {
            flex-shrink: 0;
            color: #6a7a92;
            font-size: 0.8rem;
            min-width: 60px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .chapter-row .ch-dl-btn {
            flex-shrink: 0;
            padding: 0.35rem 1rem;
            border-radius: 40px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            background: #1f293d;
            color: #bcc9e0;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: 1px solid transparent;
        }
        .chapter-row .ch-dl-btn i {
            font-size: 0.75rem;
        }
        .chapter-row .ch-dl-btn:hover {
            background: #2b3f5f;
            border-color: #3f5270;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transform: scale(1.04);
            color: #fff;
        }
        .chapter-row .ch-dl-btn:active {
            transform: scale(0.95);
        }
        .chapter-row .ch-dl-btn.downloading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* ----- status / empty states ----- */
        .status {
            text-align: center;
            padding: 3rem 1rem;
            color: #5a6a82;
        }
        .status i {
            font-size: 2.8rem;
            margin-bottom: 0.8rem;
            display: block;
            color: #2a3a5a;
        }
        .status p {
            font-size: 1rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1a2330;
            color: #d6e0f0;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            border: 1px solid #2a3a5a;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            font-size: 0.9rem;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: #2b8f6c;
            color: #8fdfc0;
        }
        .toast.error {
            border-color: #b13e4b;
            color: #f0a0aa;
        }

        /* ----- responsive ----- */
        @media (max-width: 700px) {
            .app {
                padding: 1.2rem;
            }
            .manga-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .manga-poster,
            .manga-poster-placeholder {
                width: 120px;
                height: 170px;
            }
            .manga-details h2 {
                font-size: 1.4rem;
            }
            .chapter-row {
                flex-wrap: wrap;
                gap: 0.4rem 0.6rem;
                padding: 0.7rem 0.8rem;
            }
            .chapter-row .ch-title {
                white-space: normal;
                flex-basis: 100%;
                order: 3;
            }
            .chapter-row .ch-num {
                min-width: 60px;
            }
            .chapter-row .ch-pages,
            .chapter-row .ch-size {
                font-size: 0.7rem;
            }
            .chapter-row .ch-dl-btn {
                padding: 0.25rem 0.8rem;
                font-size: 0.75rem;
            }
            .chapter-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
            }
            .chapter-controls .left,
            .chapter-controls .right {
                justify-content: center;
            }
            .search-section input {
                min-width: 140px;
                padding: 0.7rem 1rem;
            }
            .btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 450px) {
            .app {
                padding: 0.8rem;
                border-radius: 1.2rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            .chapter-row .ch-num {
                min-width: 50px;
                font-size: 0.85rem;
            }
            .manga-poster,
            .manga-poster-placeholder {
                width: 100px;
                height: 140px;
            }
        }

        /* loading spinner */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #5b7cfa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- header -->
        <h1><i class="fas fa-book-open"></i> MangaScraper</h1>
        <div class="sub"><i class="fas fa-chevron-right" style="font-size:0.6rem;margin-right:0.5rem;color:#5b7cfa;"></i> comix.to · download chapters as CBZ</div>

        <!-- search -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Manga name or comix.to URL …" />
            <button class="btn btn-primary" id="searchBtn"><i class="fas fa-search"></i> Fetch</button>
            <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-undo-alt"></i> Clear</button>
        </div>

        <!-- manga header (hidden until loaded) -->
        <div id="mangaHeader" style="display:none;">
            <div class="manga-header">
                <img id="mangaPoster" class="manga-poster" src="" alt="poster" />
                <div class="manga-details">
                    <h2 id="mangaTitle">—</h2>
                    <div class="meta" id="mangaMeta"></div>
                    <div class="desc" id="mangaDesc"></div>
                </div>
            </div>
        </div>

        <!-- chapter controls -->
        <div id="chapterControls" style="display:none;">
            <div class="chapter-controls">
                <div class="left">
                    <button class="btn btn-secondary" id="selectAllBtn"><i class="fas fa-check-double"></i> All</button>
                    <button class="btn btn-secondary" id="deselectAllBtn"><i class="fas fa-times"></i> None</button>
                    <span class="chapter-count" id="chapterCount">0 chapters</span>
                </div>
                <div class="right">
                    <button class="btn btn-success" id="downloadSelectedBtn"><i class="fas fa-download"></i> Download Selected</button>
                </div>
            </div>
        </div>

        <!-- chapter list -->
        <div id="chapterListContainer">
            <div class="status" id="emptyState">
                <i class="fas fa-search"></i>
                <p>Enter a manga name or URL to get started.</p>
            </div>
            <div class="chapter-list" id="chapterList" style="display:none;"></div>
        </div>
    </div>

    <!-- toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  FRONTEND  —  vanilla JS, lightweight
        // ============================================================

        const API_BASE = window.location.origin;

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const mangaHeader = document.getElementById('mangaHeader');
        const mangaPoster = document.getElementById('mangaPoster');
        const mangaTitle = document.getElementById('mangaTitle');
        const mangaMeta = document.getElementById('mangaMeta');
        const mangaDesc = document.getElementById('mangaDesc');
        const chapterControls = document.getElementById('chapterControls');
        const chapterList = document.getElementById('chapterList');
        const emptyState = document.getElementById('emptyState');
        const chapterCount = document.getElementById('chapterCount');
        const selectAllBtn = document.getElementById('selectAllBtn');
        const deselectAllBtn = document.getElementById('deselectAllBtn');
        const downloadSelectedBtn = document.getElementById('downloadSelectedBtn');
        const toast = document.getElementById('toast');

        let currentChapters = [];
        let currentManga = null;
        let toastTimer = null;

        // ---------- toast ----------
        function showToast(msg, type = 'info') {
            if (toastTimer) clearTimeout(toastTimer);
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        // ---------- format size ----------
        function formatSize(bytes) {
            if (!bytes || bytes === 0) return '—';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // ---------- render chapters ----------
        function renderChapters(chapters, mangaTitle) {
            currentChapters = chapters;
            if (!chapters || chapters.length === 0) {
                chapterList.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.innerHTML = `<i class="fas fa-exclamation-circle"></i><p>No chapters found for this manga.</p>`;
                chapterControls.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
